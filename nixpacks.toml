[phases.setup]
nixPkgs = ["php82", "php82Extensions.pdo", "php82Extensions.pdo_mysql", "php82Extensions.mbstring", "php82Extensions.xml", "php82Extensions.curl", "php82Extensions.zip", "php82Extensions.gd", "php82Extensions.tokenizer", "php82Extensions.intl", "php82Extensions.bcmath", "composer"]

[phases.install]
cmds = ["composer install --optimize-autoloader --no-scripts --no-interaction --ignore-platform-reqs"]

[phases.build]
cmds = ["mkdir -p public/storage && php artisan storage:link --force"]

[start]
cmd = "php artisan config:cache && php artisan serve --host=0.0.0.0 --port=$PORT"